services:
  mysql:
    image: mysql:8
    container_name: life-museum-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: life_museum
      MYSQL_USER: life_museum
      MYSQL_PASSWORD: life_museum_password
    ports:
      - "3306:3306"
    volumes:
      - life_museum_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulife_museum", "-plife_museum_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: life-museum-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: life_museum_minio
      MINIO_ROOT_PASSWORD: life_museum_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - life_museum_minio:/data

volumes:
  life_museum_mysql:
  life_museum_minio:
